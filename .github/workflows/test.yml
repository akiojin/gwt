name: Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  # Issue #4872: retain merge-queue compatibility for organization repositories.
  # Issue #5169: this User-owned repository uses non-strict protection and
  # develop push CI. The queue re-tests
  # each pull request on the latest base under this event, and a required
  # check nobody reports for it stays pending forever, so every job here runs
  # for the queue exactly as it does for a pull request. Pinned by
  # crates/gwt/tests/ci_concurrency_contract_test.rs; the settings this pairs
  # with are recorded in AGENTS.md ("Merge queue").
  merge_group:
    types: [checks_requested]

# Issue #5059: workflow-level cancellation happens before any Git comparison,
# so it cannot distinguish a product push from base-only synchronization. Give
# each run its own group, then bound each workload to one running/one pending
# job per PR below. A proven product push replaces running jobs (#4119); a
# base sync replaces only pending jobs and lets running work finish.
# Workloads preserve running work for unknown history.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  source-sync:
    name: Classify CI synchronization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-source-sync
      cancel-in-progress: true
    outputs:
      base_only: ${{ steps.relation.outputs.base_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Run the classifier from the CI tree so older PR branches can use a
          # classifier newly added to base; it compares explicit event SHAs.
          fetch-depth: 0
          filter: blob:none
      - name: Read this PR's Test run history
        if: github.event.pull_request.number
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api --method GET "repos/$REPO/actions/workflows/test.yml/runs" -f branch="$PR_BRANCH" -f event=pull_request -f per_page=100 --paginate --slurp > "$RUNNER_TEMP/ci-runs.json"
      - name: Distinguish base synchronization from PR changes
        id: relation
        run: python3 scripts/ci_sync_relation.py --event-file "$GITHUB_EVENT_PATH" --runs-file "$RUNNER_TEMP/ci-runs.json" > "$RUNNER_TEMP/ci-source-relation.json"

  # Issue #4119 AC-2: classify the PR's files once so jobs a documentation edit
  # cannot affect skip instead of queueing a Windows runner. Only jobs that are
  # NOT a develop required status check may depend on this job: GitHub reports
  # a skipped job as Success to branch protection, so gating a required check
  # here would let a PR merge without running it. The gated jobs condition on
  # `!cancelled() && needs.changes.outputs.docs_only != 'true'`, so a failed
  # classification (API error) falls open to running them. Both properties are
  # pinned by crates/gwt/tests/ci_concurrency_contract_test.rs.
  changes:
    name: Classify changed files
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-changes
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      # SPEC #4551 T-055: the cargo test targets the PR touched, as
      # `<crate>|test|<name>` / `<crate>|lib|` tokens, so the flake job repeats
      # only those. Crate granularity does not fit: measured on this runner
      # class, one `cargo test --workspace --all-features` takes 11m23s, so 20
      # runs of a changed `gwt` alone would blow any step budget. The SPEC's own
      # cost model is per target ("#4550 は 54 テスト 0.53 秒で、20 回でも 11 秒").
      flake_targets: ${{ steps.classify.outputs.flake_targets }}
    steps:
      # Source mapping reads Cargo registrations and harnesses for each event.
      # A merge group also needs history for its changed-file diff. `blob:none`
      # keeps that full-history fetch to commits and trees.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.event.after }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            files=$(git diff --name-only --no-renames "$MERGE_GROUP_BASE" "$MERGE_GROUP_HEAD")
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            files=$(git diff --name-only --no-renames "$PUSH_BASE" "$PUSH_HEAD")
          else
            files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          fi
          # Documentation is Markdown anywhere plus docs/. Markdown the binaries
          # embed is code: CHANGELOG.md (include_str! in gwt-core) and
          # .claude/ + .codex/ (include_dir! in gwt-skills).
          docs_only=true
          flake_targets=""
          add_target() {
            case " $flake_targets " in
              *" $1 "*) ;;
              *) flake_targets="${flake_targets:+$flake_targets }$1" ;;
            esac
          }
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              CHANGELOG.md|.claude/*|.codex/*) docs_only=false ;;
              docs/*|*.md) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              crates/*/*) crate="${file#crates/}"; crate="${crate%%/*}" ;;
              *) continue ;;
            esac
            case "$file" in
              crates/gwt/tests/*.rs)
                # Explicit suites map original modules after the file walk.
                ;;
              "crates/$crate/tests/"*.rs)
                # Only a direct child of tests/ is its own integration target;
                # a helper module in a subdirectory is not.
                leaf="${file#crates/$crate/tests/}"
                case "$leaf" in
                  */*) ;;
                  *) add_target "$crate|test|${leaf%.rs}" ;;
                esac
                ;;
              "crates/$crate/src/"*)
                # `#[cfg(test)]` units. Bin-only targets are not repeated here;
                # `Test (Rust)` still runs them once.
                add_target "$crate|lib|"
                ;;
            esac
          done <<<"$files"
          suite_targets="$(python scripts/test_layout.py targets <<<"$files")"
          while IFS= read -r target; do
            [ -z "$target" ] || add_target "$target"
          done <<<"$suite_targets"
          echo "$files"
          echo "docs_only=$docs_only"
          echo "flake_targets=$flake_targets"
          echo "docs_only=$docs_only" >>"$GITHUB_OUTPUT"
          echo "flake_targets=$flake_targets" >>"$GITHUB_OUTPUT"

  test:
    name: Test (Rust workspace ${{ matrix.shard }}/6)
    if: ${{ !cancelled() }}
    needs: source-sync
    # Issue #5564: warm builds take ~160s, but serial execution takes ~720s.
    # Six slices keep fixture execution serial on each isolated runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-${{ matrix.shard }}-test
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: ubuntu-latest
    # Issue #4055 / #4191: the step budgets below are the operative limits;
    # this cap only bounds the job as a whole and must cover their sum
    # including nextest installation, doctests and the timeout regression.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      # Issue #4191 AC-2: restoring the .deb archive before the install means a
      # warm cache installs without touching a mirror at all. The key hashes
      # scripts/ci-apt.sh because that script owns the package list, so a
      # changed package set can never be served the previous archive. The
      # extra packages passed below are not in that hash, so the key prefix
      # names them (Issue #4134 AC-4 adds `dbus` for `dbus-run-session`).
      #
      # Issue #4268: that prefix also put this job in its own cache namespace.
      # With no restore-keys the key hit only on an exact match, so `Test
      # (Rust)` could never reuse the archives `Build` / `Clippy` had already
      # warmed under `gwt-apt-gtk-` even though `gtk-deps` is a strict subset of
      # `gtk-deps xvfb dbus` — and its own key was written only by a run that
      # succeeded, which is the run that kept failing. That is the asymmetry
      # behind `Test (Rust)` failing while the other Linux jobs passed, and it
      # is why a stalled mirror had all 59.2 MB to stall on. The second
      # fallback reaches the shared namespace; only xvfb and dbus are then
      # missing from it.
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-xvfb-dbus-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          restore-keys: |
            gwt-apt-gtk-xvfb-dbus-${{ runner.os }}-
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      # Issue #4191: measured over the last 60 green runs this step takes p50
      # 29s, p90 48s, p95 60s, max 106s, so the previous 5-minute cap sat at
      # ~3x the worst healthy run. Hitting it therefore meant a stalled mirror,
      # not a slow one, and the job reported FAILURE having executed zero
      # tests. scripts/ci-apt.sh now owns the deadline (900s) and retries
      # inside it; this cap is only the outer net and must stay above that,
      # because a step GitHub kills cannot report the failure as a dependency
      # failure rather than a test failure. Pinned by
      # crates/gwt/tests/ci_linux_dependency_install_contract_test.rs.
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps xvfb dbus
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@1.119.0
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
        timeout-minutes: 5
      # Issue #4133: naming the scope is what lets cache-warm.yml populate it
      # from develop/main. Without `shared-key` the key embeds GITHUB_JOB, so
      # only a job with this exact id could ever write a cache this job reads —
      # and no push-triggered workflow did, which is why every PR's first Rust
      # job rebuilt 377 crates.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          shared-key: linux-workspace
        continue-on-error: true
      # Separate compilation from execution in the Actions step timings. This
      # unpartitioned list is the original --workspace --all-features test set.
      - name: Build and inventory workspace tests
        run: |
          mkdir -p target/workspace-test-evidence
          cargo nextest list --workspace --all-features --message-format json > target/workspace-test-evidence/inventory.json
        timeout-minutes: 25
      # Issue #4055: 21 green runs measured this step at 500–725s (p95 ~660s)
      # and a slow runner crossed the old 15-minute cap with every suite ok
      # (run 34063577896: gwt lib 231s + gwt bin 318s, 2.5x the usual). The
      # budget is p95 +50% rounded up so a cold cache or a slow runner cannot
      # turn a green suite into a timeout. Pinned by
      # crates/gwt/tests/ci_test_budget_contract_test.rs.
      - name: Run tests
        run: cargo nextest run --workspace --all-features --test-threads=1 --profile ci --partition slice:${{ matrix.shard }}/6
        timeout-minutes: 25
      # SPEC #4551 T-050 / AC-5: mechanism (C) -- a child the suite never
      # reaped. It has no textual shape to scan for and it does not fail the
      # run that caused it; it hangs the next one (#3845) or holds the host
      # verification lease and starves the fleet (#4182). So it is observed
      # here, immediately after the suite, while the orphan is still alive.
      # Pinned by crates/gwt/tests/ci_flake_hygiene_contract_test.rs.
      - name: Check for processes the suite failed to reap
        if: ${{ !cancelled() }}
        run: scripts/ci-check-orphan-processes.sh
        timeout-minutes: 5
      # nextest isolates normal tests; doctests retain rustdoc's own harness.
      - name: Run doctests
        if: matrix.shard == 1
        run: cargo test --workspace --all-features --doc
        timeout-minutes: 5
      # Issue #4134 AC-4: four tests cost 226s here and 3.9s on macOS for the
      # same nine spawn/stop cycles, so the wait is inside one `gwt` lifetime
      # under Xvfb rather than in the serialization. The instrumented run showed
      # shutdown at 0.03s and startup at a flat 25.10s — GDBus's default call
      # timeout. `xvfb-run` gives the GTK event loop a display but no session
      # bus, so `dbus-run-session` supplies the other half of a headless GTK
      # environment. `--nocapture` keeps the per-phase attribution visible, so
      # a run that still reports ~25s refutes that explanation instead of
      # hiding it.
      # Issue #4535 AC-6: `project_restore_integration` joins this step because
      # it spawns the same real binary and therefore needs the same display and
      # session bus. One `gwt` lifetime, so the step budget is unchanged.
      - name: Run real-binary front-door tests (Xvfb)
        if: matrix.shard == 1
        run: dbus-run-session -- xvfb-run -a cargo test -p gwt --all-features --test stable_server_port --test project_restore_integration --test open_cli_integration -- --ignored --test-threads=1 --nocapture
        timeout-minutes: 10
      - name: Voice accuracy regression (optional local dataset)
        if: matrix.shard == 1
        run: |
          if [ -f tests/voice_eval/manifest.json ]; then
            scripts/voice-eval.sh --max-wer-delta 0.03 --max-cer-delta 0.03
          else
            echo "Skipping voice accuracy regression: tests/voice_eval/manifest.json not found."
          fi
        timeout-minutes: 10
      - name: Upload workspace test inventory and results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-tests-${{ matrix.shard }}
          overwrite: true
          path: |
            target/workspace-test-evidence/inventory.json
            target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

  # Issue #4821: infrastructure regressions run beside the workspace suite.
  test-linux-infrastructure:
    name: Test (Linux infrastructure)
    if: ${{ !cancelled() }}
    needs: source-sync
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-linux-infrastructure
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          restore-keys: |
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@1.119.0
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
        timeout-minutes: 5
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          shared-key: linux-workspace
        continue-on-error: true
      - name: Build infrastructure regression artifacts
        run: cargo test -p gwt --all-features --lib --test cli_contracts --no-run
        timeout-minutes: 25
      - name: Verify per-test timeout and suite continuation
        run: node scripts/test-nextest-timeout.mjs
        timeout-minutes: 5
      # Issue #4317: the script arms the guarded artifact itself and drives
      # refusal -> `cargo build -p gwt --bin gwtd` -> successful GitHub read,
      # which is the recovery verify.run now appends to its own matrix.
      - name: Run gwtd verification artifact regression
        run: python3 scripts/test-gwtd-verification-artifact.py
        timeout-minutes: 10
      # Issue #4346: repeat the exact lock check with three concurrent cargo
      # workers held until completion; reject zero tests and worker failures.
      - name: Run managed asset lock concurrency regression
        run: python3 scripts/test-managed-assets-lock-stress.py
        timeout-minutes: 10

  # Keep the existing protected check while both workloads run in parallel.
  # always() makes failure, cancellation and skipped dependencies fail closed.
  test-rust-required:
    name: Test (Rust)
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-rust-required
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: ubuntu-latest
    needs: [test, test-linux-infrastructure, source-sync]
    if: ${{ !cancelled() }}
    steps:
      - name: Require Rust verification
        env:
          RUST_RESULT: ${{ needs.test.result }}
          INFRA_RESULT: ${{ needs.test-linux-infrastructure.result }}
        run: |
          echo "Rust workspace: $RUST_RESULT; Linux infrastructure: $INFRA_RESULT"
          test "$RUST_RESULT" = success
          test "$INFRA_RESULT" = success
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: workspace-tests-*
          path: target/workspace-shards
      - name: Verify workspace shards preserve every test exactly once
        run: python3 scripts/ci_workspace_tests.py target/workspace-shards --shards 6

  # SPEC #4551 T-055 / AC-6: one green run says nothing about a test whose
  # result is not a function of its source. All 16 issues this SPEC bundles
  # were found by an unrelated PR turning red, never by the PR that introduced
  # them. This re-runs only the test targets the PR touched, at default
  # parallelism (#4023 and #4182 reproduce only when the suite competes with
  # itself), and fails when the outcome changes between runs.
  #
  # Flake detection is a required status check on develop (Issue #5171).
  # Its target filter is the exception to the optional-job filter above.
  # No changed test targets intentionally means there is nothing to compare.
  # Libraries run twice; integration targets run up to 20 times within the
  # 220s detector budget, including build and test listing. This reserves
  # time for job setup/cleanup under Issue #5566's 300s wall-time target.
  # The minimum two-run comparison takes precedence over the budget. Pinned by
  # crates/gwt/tests/ci_flake_hygiene_contract_test.rs.
  flake-detection:
    name: Flake detection (changed test targets)
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-flake-detection
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    needs: [changes, source-sync]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.flake_targets != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          restore-keys: |
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@1.119.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          shared-key: linux-workspace
        continue-on-error: true
      # N lives in the script, not here, so the number the gate actually runs
      # is the number the contract test reads.
      - name: Re-run the changed test targets until the outcome wobbles
        env:
          # Omit workspace line tables only for repetition artifacts. Keep
          # these after cache restore: dependencies already use debug=false.
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
          GWT_FLAKE_TARGETS: ${{ needs.changes.outputs.flake_targets }}
          GWT_FLAKE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          GWT_FLAKE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          GWT_FLAKE_BUDGET_SECS: "220"
          GWT_FLAKE_LOG_DIR: ${{ runner.temp }}/gwt-flake-logs
        run: scripts/ci-flake-detect.sh
        timeout-minutes: 45
      - name: Upload flake diagnostics even on failure or cancellation
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: flake-detection-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gwt-flake-logs
          if-no-files-found: ignore
          retention-days: 14
        timeout-minutes: 5

  test-python-runner:
    name: Test (Python runner)
    if: ${{ !cancelled() }}
    needs: source-sync
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-python-runner
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Check CI source classification and paired evidence
        run: python -m unittest discover -s scripts -p 'test_ci_*.py'
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crates/gwt-core/runtime/project_index_requirements.txt
          pip install pytest
      - name: Run Phase 8 runner tests
        env:
          GWT_INDEX_FAKE_EMBEDDING: "1"
        run: pytest -q crates/gwt-core/runtime/tests crates/gwt-core/runtime/test_chroma_index_runner.py
        timeout-minutes: 10

  test-index-e2e:
    name: Test (e5 e2e, optional)
    needs: source-sync
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-index-e2e
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.119.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          shared-key: linux-workspace
        continue-on-error: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache HuggingFace model (e5-base)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-cache-multilingual-e5-base-v1
      - name: Bootstrap gwt runtime assets
        run: |
          mkdir -p ~/.gwt/runtime
          cp crates/gwt-core/runtime/chroma_index_runner.py ~/.gwt/runtime/
          python -m venv ~/.gwt/runtime/chroma-venv
          ~/.gwt/runtime/chroma-venv/bin/pip install --upgrade pip
          ~/.gwt/runtime/chroma-venv/bin/pip install -r crates/gwt-core/runtime/project_index_requirements.txt
      - name: Run ignored e2e tests with real e5 model
        run: cargo test -p gwt-core --test index_runner_spawn -- --ignored
        timeout-minutes: 30
        continue-on-error: true

  # Issue #5565: compile one core feature set, then share the same harnesses.
  test-windows-core-build:
    name: Build Windows core test artifacts
    if: ${{ !cancelled() }}
    needs: source-sync
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-windows-core-build
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.119.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          shared-key: windows-workspace
        continue-on-error: true
      - name: Build the complete core suite once
        run: node scripts/ci-windows-tests.mjs build core
        timeout-minutes: 20
      - name: Record the complete core test inventory
        run: node scripts/ci-windows-tests.mjs run-core --list > target/ci-windows-tests-core-inventory.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-core-tests
          path: |
            target/ci-windows-tests-core.json
            target/ci-windows-tests-core-inventory.txt
            target/debug/deps/*.exe
            target/debug/deps/*.dll
            target/debug/*.dll
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      # cargo --no-run does not compile doctests. Keep all five original passes.
      - name: Run core doctests five times
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            cargo test -p gwt-core --all-features --doc
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        timeout-minutes: 5

  # Five independent, native default-parallel runs of the same compiled suite.
  test-windows-core-stability:
    name: Windows core stability (${{ matrix.run }}/5)
    if: ${{ !cancelled() && needs.test-windows-core-build.result == 'success' }}
    needs: [source-sync, test-windows-core-build]
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-${{ matrix.run }}-test-windows-core-stability
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: windows-core-tests
          path: target
      - name: Run the complete gwt-core suite at default parallelism
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          CORE_STABILITY_RUN: ${{ matrix.run }}
        run: |
          Remove-Item Env:RUST_TEST_THREADS -ErrorAction SilentlyContinue
          Write-Host "logical processors: $([Environment]::ProcessorCount)"
          Write-Host "default-parallel core run $env:CORE_STABILITY_RUN of 5"
          node scripts/ci-windows-tests.mjs run-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        timeout-minutes: 30

  # Issue #5030: keep twenty consecutive runs on one native host, independent
  # of the five full-suite passes so neither delays the other after compilation.
  test-windows-index-stability:
    name: Windows index coordinator stability (20 runs)
    if: ${{ !cancelled() && needs.test-windows-core-build.result == 'success' }}
    needs: [source-sync, test-windows-core-build]
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-windows-index-stability
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: windows-core-tests
          path: target
      # Issue #5030: five full-suite passes do not measure the intermittent
      # registration-departure race. Repeat its entire integration target at
      # default parallelism, retaining all outcomes even after a failure.
      - name: Measure index coordinator stability over twenty runs
        shell: pwsh
        run: |
          Remove-Item Env:RUST_TEST_THREADS -ErrorAction SilentlyContinue
          $failures = 0
          1..20 | ForEach-Object {
            Write-Host "index coordinator run $_ of 20"
            node scripts/ci-windows-tests.mjs run-core-index
            if ($LASTEXITCODE -ne 0) { $failures++ }
          }
          Write-Host "index coordinator: $failures failures out of 20 runs"
          if ($failures -ne 0) { exit 1 }
        timeout-minutes: 15

  # Issue #5565: keep each default test harness on one host while compiling
  # library harnesses beside runtime/integration harnesses. Both keep the
  # original four Cargo roots and feed the same protected Windows check.
  test-windows-rust:
    name: Test (Windows regressions)
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-windows-rust
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    needs: source-sync
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # T453 receipts must describe the pushed head, not a synthetic merge.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@1.119.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          shared-key: windows-workspace
        continue-on-error: true
      - name: Check Windows test runner
        run: node --test scripts/ci-windows-tests.test.mjs
      - name: Build Windows regression targets once
        # Test inherits dev; keep assertions/features while omitting CI line tables.
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: node scripts/ci-windows-tests.mjs build default-runtime
        timeout-minutes: 30
      # Issue #1921 T453: prove each accepted filter executes one native test.
      - name: Run T453 exact Windows runtime regressions
        shell: bash
        run: |
          exact() {
            "$@" | tee "$RUNNER_TEMP/t453-exact.log"
            grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/t453-exact.log"
          }
          exact node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt app_runtime::tests::continuation_authority_tests::continue_work_nonlocal_liveness_distinguishes_live_dead_and_stopped_owners -- --exact --test-threads=1 --nocapture
          exact node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt tests::powershell_agent_wrapper_quotes_spaced_path_and_single_quotes -- --exact --test-threads=1 --nocapture
          exact node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt app_runtime::tests::continuation_completion_tests::startup_self_heal_converges_legacy_config_to_explicit_hook_binary_pin -- --exact --test-threads=1 --nocapture
          exact node scripts/ci-windows-tests.mjs run-runtime gwt test hook_contracts hook_health_test::managed_hook_health_understands_runtime_indirect_fallbacks -- --exact --test-threads=1 --nocapture
          exact node scripts/ci-windows-tests.mjs run-runtime gwt test hook_contracts hook_health_test::managed_hook_health_understands_all_provider_runtime_indirect_fallbacks -- --exact --test-threads=1 --nocapture
          exact node scripts/ci-windows-tests.mjs run-runtime gwt test cli_contracts discussion_cli_test::discussion_update_creates_single_canonical_discussions_file -- --exact --test-threads=1 --nocapture
          exact node scripts/ci-windows-tests.mjs run-runtime gwt test cli_contracts memory_cli_test::memory_add_writes_to_machine_local_work_notes -- --exact --test-threads=1 --nocapture
        timeout-minutes: 15
      - name: Run cross-process FIFO reservation contention regression
        run: node scripts/ci-windows-tests.mjs run-runtime gwt test cli_contracts verification_lease_cli_test::deferred_fifo_survives_status_read_contention_and_new_processes -- --exact --nocapture
        timeout-minutes: 5
      - name: Run managed hook self-heal regressions
        shell: bash
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt app_runtime::tests::continuation_completion_tests::startup_self_heal_converges_legacy_config_without_a_runtime_guard -- --exact --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt test hook_contracts hook_health_test::codex_hook_audit_and_repair_cover_worktree_local_and_workspace_home_copies -- --exact --test-threads=1
        timeout-minutes: 15
      - name: Run GUI dispatch stall diagnostic regressions
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt dispatch_watchdog::tests:: -- --test-threads=1
        timeout-minutes: 15
      - name: Run priority roundtrip from Normal and BelowNormal launchers
        run: node scripts/ci-windows-tests.mjs run-runtime gwt-core test process_priority_roundtrip -- --nocapture
        timeout-minutes: 15
      - name: Run shared Windows process resolver tests
        shell: bash
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt-core test windows_process_resolver
          node scripts/ci-windows-tests.mjs run-runtime gwt-core test process_adapter_parity
        timeout-minutes: 15
      - name: Run real Claude probe caller regressions
        shell: bash
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt-core test windows_claude_user_agent
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt real_bun_global_placeholder_fixture
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt command_prompt_agent_wrapper
        timeout-minutes: 15
      # Issue #3631: the GUI-subsystem start gate must attach to ConPTY.
      # Both guards are Windows-only and are skipped by the Linux suite.
      - name: Run Windows PTY start-gate console contracts
        shell: bash
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt test ci_contracts windows_binary_subsystem_test:: -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt test runtime_tests pty_start_gate_console_test:: -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt-terminal test pty_start_gate_test -- --test-threads=1
        timeout-minutes: 15
      - name: Run Issue Monitor scheduled driver contracts
        shell: bash
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt scheduled_tick_is_single_flight_per_canonical_project_scope -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt scheduled_tick_drives_disabled_claim_cleanup_without_scanning -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt scheduled_tick_advances_autonomous_launch_without_an_external_daemon -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt app_runtime_local_driver_ -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt app_runtime::tests::issue_monitor_claim_tests::app_runtime_full_issue_monitor_scan_migrates_legacy_git_failure_and_persists_marker -- --exact --test-threads=1
        timeout-minutes: 15
      - name: Run Issue Monitor launch_now control-path contracts
        shell: bash
        run: |
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt embedded_server::tests::authenticated_monitor_scan_routes_scope_guard_and_result_only_to_origin_socket -- --exact --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt authenticated_pm_scan_now_ -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt authenticated_scan_now_ -- --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt test coordination_tests issue_monitor_protocol_test::frontend_issue_monitor_events_use_snake_case_wire_shape -- --exact --test-threads=1
          node scripts/ci-windows-tests.mjs run-runtime gwt test coordination_tests issue_monitor_protocol_test::agent_issue_monitor_scan_ -- --test-threads=1
        timeout-minutes: 15
      - name: Run agent process resolver caller contracts
        run: 'node scripts/ci-windows-tests.mjs run-runtime gwt test runtime_tests agent_process_resolution_contract_test::'
        timeout-minutes: 15
      - name: Run Windows verification driver relink regression
        # Issue #5466 AC-4: all ten passes retain their real-artifact assertions.
        # Each process has private fixture HOME/project/target directories.
        run: |
          $jobs = 1..5 | ForEach-Object {
            Start-Job -ArgumentList (Get-Location).Path,$_ -ScriptBlock {
              param($repo, $worker)
              Set-Location $repo
              for ($attempt = 1; $attempt -le 2; $attempt++) {
                Write-Host "Windows verification driver worker $worker attempt $attempt of 2"
                node scripts/ci-windows-tests.mjs run-runtime gwt test cli_contracts verification_driver_cli_test:: -- --test-threads=1
                if ($LASTEXITCODE -ne 0) { throw "driver worker $worker failed ($LASTEXITCODE)" }
              }
            }
          }
          try {
            $results = $jobs | Wait-Job
            $results | Receive-Job -ErrorAction Continue
            if (@($results | Where-Object State -ne Completed).Count -ne 0) { exit 1 }
          } finally {
            $jobs | Remove-Job -Force
          }
        timeout-minutes: 20
      - name: Run release asset contract tests
        run: node scripts/test_release_assets.cjs
        timeout-minutes: 15
      # Issue #4821: keep the readiness contract within 60 seconds.
      # Native timing measurements run on the nightly path.
      - name: Check Windows startup tray readiness contract
        run: node scripts/ci-windows-tests.mjs run-runtime gwt test startup_tray_performance startup_metric_and_native_command_contract -- --exact --test-threads=1 --nocapture
        timeout-minutes: 1
      # Issue #4803 AC-4: Linux runs this in the workspace suite; pin it here
      # too so exceeding the deterministic 1500-session Git budget fails CI.
      - name: Check startup update Git-spawn budget
        run: node scripts/ci-windows-tests.mjs run-runtime gwt bin gwt app_runtime::tests::workspace_resume_tests::startup_restore_update_marker_1500_sessions_bounds_git_spawns -- --exact --test-threads=1
        timeout-minutes: 15

