name: Test

on:
  pull_request:
    branches: [develop, main]

# Issue #4119: one run per PR. A develop merge turns every open PR BEHIND, the
# update-branch `synchronize` starts a fresh run, and without this group the
# superseded run stayed queued beside it (3-5 runs per branch, 35 queued and 0
# running on 2026-09-07). Keyed by workflow + PR number so a new push cancels
# only this PR's older run of this workflow. Pinned by
# crates/gwt/tests/ci_concurrency_contract_test.rs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Issue #4119 AC-2: classify the PR's files once so jobs a documentation edit
  # cannot affect skip instead of queueing a Windows runner. Only jobs that are
  # NOT a develop required status check may depend on this job: GitHub reports
  # a skipped job as Success to branch protection, so gating a required check
  # here would let a PR merge without running it. The gated jobs condition on
  # `!cancelled() && needs.changes.outputs.docs_only != 'true'`, so a failed
  # classification (API error) falls open to running them. Both properties are
  # pinned by crates/gwt/tests/ci_concurrency_contract_test.rs.
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      # SPEC #4551 T-055: the cargo test targets the PR touched, as
      # `<crate>|test|<name>` / `<crate>|lib|` tokens, so the flake job repeats
      # only those. Crate granularity does not fit: measured on this runner
      # class, one `cargo test --workspace --all-features` takes 11m23s, so 20
      # runs of a changed `gwt` alone would blow any step budget. The SPEC's own
      # cost model is per target ("#4550 は 54 テスト 0.53 秒で、20 回でも 11 秒").
      flake_targets: ${{ steps.classify.outputs.flake_targets }}
    steps:
      - name: Classify changed files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          # Documentation is Markdown anywhere plus docs/. Markdown the binaries
          # embed is code: CHANGELOG.md (include_str! in gwt-core) and
          # .claude/ + .codex/ (include_dir! in gwt-skills).
          docs_only=true
          flake_targets=""
          add_target() {
            case " $flake_targets " in
              *" $1 "*) ;;
              *) flake_targets="${flake_targets:+$flake_targets }$1" ;;
            esac
          }
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              CHANGELOG.md|.claude/*|.codex/*) docs_only=false ;;
              docs/*|*.md) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              crates/*/*) crate="${file#crates/}"; crate="${crate%%/*}" ;;
              *) continue ;;
            esac
            case "$file" in
              "crates/$crate/tests/"*.rs)
                # Only a direct child of tests/ is its own integration target;
                # a helper module in a subdirectory is not.
                leaf="${file#crates/$crate/tests/}"
                case "$leaf" in
                  */*) ;;
                  *) add_target "$crate|test|${leaf%.rs}" ;;
                esac
                ;;
              "crates/$crate/src/"*)
                # `#[cfg(test)]` units. Bin-only targets are not repeated here;
                # `Test (Rust)` still runs them once.
                add_target "$crate|lib|"
                ;;
            esac
          done <<<"$files"
          echo "$files"
          echo "docs_only=$docs_only"
          echo "flake_targets=$flake_targets"
          echo "docs_only=$docs_only" >>"$GITHUB_OUTPUT"
          echo "flake_targets=$flake_targets" >>"$GITHUB_OUTPUT"

  test:
    name: Test (Rust)
    runs-on: ubuntu-latest
    # Issue #4055 / #4191: the step budgets below are the operative limits;
    # this cap only bounds the job as a whole and must cover their sum
    # including nextest installation, doctests and the timeout regression.
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7
      # Issue #4191 AC-2: restoring the .deb archive before the install means a
      # warm cache installs without touching a mirror at all. The key hashes
      # scripts/ci-apt.sh because that script owns the package list, so a
      # changed package set can never be served the previous archive. The
      # extra packages passed below are not in that hash, so the key prefix
      # names them (Issue #4134 AC-4 adds `dbus` for `dbus-run-session`).
      #
      # Issue #4268: that prefix also put this job in its own cache namespace.
      # With no restore-keys the key hit only on an exact match, so `Test
      # (Rust)` could never reuse the archives `Build` / `Clippy` had already
      # warmed under `gwt-apt-gtk-` even though `gtk-deps` is a strict subset of
      # `gtk-deps xvfb dbus` — and its own key was written only by a run that
      # succeeded, which is the run that kept failing. That is the asymmetry
      # behind `Test (Rust)` failing while the other Linux jobs passed, and it
      # is why a stalled mirror had all 59.2 MB to stall on. The second
      # fallback reaches the shared namespace; only xvfb and dbus are then
      # missing from it.
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-xvfb-dbus-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          restore-keys: |
            gwt-apt-gtk-xvfb-dbus-${{ runner.os }}-
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      # Issue #4191: measured over the last 60 green runs this step takes p50
      # 29s, p90 48s, p95 60s, max 106s, so the previous 5-minute cap sat at
      # ~3x the worst healthy run. Hitting it therefore meant a stalled mirror,
      # not a slow one, and the job reported FAILURE having executed zero
      # tests. scripts/ci-apt.sh now owns the deadline (900s) and retries
      # inside it; this cap is only the outer net and must stay above that,
      # because a step GitHub kills cannot report the failure as a dependency
      # failure rather than a test failure. Pinned by
      # crates/gwt/tests/ci_linux_dependency_install_contract_test.rs.
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps xvfb dbus
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@stable
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
        timeout-minutes: 5
      # Issue #4133: naming the scope is what lets cache-warm.yml populate it
      # from develop/main. Without `shared-key` the key embeds GITHUB_JOB, so
      # only a job with this exact id could ever write a cache this job reads —
      # and no push-triggered workflow did, which is why every PR's first Rust
      # job rebuilt 377 crates.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
        continue-on-error: true
      # Issue #4055: 21 green runs measured this step at 500–725s (p95 ~660s)
      # and a slow runner crossed the old 15-minute cap with every suite ok
      # (run 34063577896: gwt lib 231s + gwt bin 318s, 2.5x the usual). The
      # budget is p95 +50% rounded up so a cold cache or a slow runner cannot
      # turn a green suite into a timeout. Pinned by
      # crates/gwt/tests/ci_test_budget_contract_test.rs.
      - name: Run tests
        run: cargo nextest run --workspace --all-features --test-threads=1
        timeout-minutes: 25
      # SPEC #4551 T-050 / AC-5: mechanism (C) -- a child the suite never
      # reaped. It has no textual shape to scan for and it does not fail the
      # run that caused it; it hangs the next one (#3845) or holds the host
      # verification lease and starves the fleet (#4182). So it is observed
      # here, immediately after the suite, while the orphan is still alive.
      # Pinned by crates/gwt/tests/ci_flake_hygiene_contract_test.rs.
      - name: Check for processes the suite failed to reap
        if: ${{ !cancelled() }}
        run: scripts/ci-check-orphan-processes.sh
        timeout-minutes: 5
      # nextest isolates normal tests; doctests retain rustdoc's own harness.
      - name: Run doctests
        run: cargo test --workspace --all-features --doc
        timeout-minutes: 5
      - name: Verify per-test timeout and suite continuation
        run: node scripts/test-nextest-timeout.mjs
        timeout-minutes: 5
      # Issue #4317: the workspace test step enables the self dev-dependency's
      # `test-gh-guard` feature, so the target/debug/gwtd it leaves behind
      # refuses every real `gh` spawn. This drives the real artifact through
      # refusal -> `cargo build -p gwt --bin gwtd` -> successful GitHub read,
      # which is the recovery verify.run now appends to its own matrix.
      - name: Run gwtd verification artifact regression
        run: python3 scripts/test-gwtd-verification-artifact.py
        timeout-minutes: 10
      # Issue #4346: repeat the exact lock check with three concurrent cargo
      # workers held until completion; reject zero tests and worker failures.
      - name: Run managed asset lock concurrency regression
        run: python3 scripts/test-managed-assets-lock-stress.py
        timeout-minutes: 10
      # Issue #4134 AC-4: four tests cost 226s here and 3.9s on macOS for the
      # same nine spawn/stop cycles, so the wait is inside one `gwt` lifetime
      # under Xvfb rather than in the serialization. The instrumented run showed
      # shutdown at 0.03s and startup at a flat 25.10s — GDBus's default call
      # timeout. `xvfb-run` gives the GTK event loop a display but no session
      # bus, so `dbus-run-session` supplies the other half of a headless GTK
      # environment. `--nocapture` keeps the per-phase attribution visible, so
      # a run that still reports ~25s refutes that explanation instead of
      # hiding it.
      # Issue #4535 AC-6: `project_restore_integration` joins this step because
      # it spawns the same real binary and therefore needs the same display and
      # session bus. One `gwt` lifetime, so the step budget is unchanged.
      - name: Run real-binary front-door tests (Xvfb)
        run: dbus-run-session -- xvfb-run -a cargo test -p gwt --all-features --test stable_server_port --test project_restore_integration -- --ignored --test-threads=1 --nocapture
        timeout-minutes: 10
      - name: Voice accuracy regression (optional local dataset)
        run: |
          if [ -f tests/voice_eval/manifest.json ]; then
            scripts/voice-eval.sh --max-wer-delta 0.03 --max-cer-delta 0.03
          else
            echo "Skipping voice accuracy regression: tests/voice_eval/manifest.json not found."
          fi
        timeout-minutes: 10

  # SPEC #4551 T-055 / AC-6: one green run says nothing about a test whose
  # result is not a function of its source. All 16 issues this SPEC bundles
  # were found by an unrelated PR turning red, never by the PR that introduced
  # them. This re-runs only the test targets the PR touched, at default
  # parallelism (#4023 and #4182 reproduce only when the suite competes with
  # itself), and fails when the outcome changes between runs.
  #
  # It depends on `changes`, so its name must stay off the develop required
  # status checks: branch protection reads a skipped job as Success. Pinned by
  # crates/gwt/tests/ci_flake_hygiene_contract_test.rs.
  flake-detection:
    name: Flake detection (changed test targets)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.flake_targets != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          restore-keys: |
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
        continue-on-error: true
      # N lives in the script, not here, so the number the gate actually runs
      # is the number the contract test reads.
      - name: Re-run the changed test targets until the outcome wobbles
        env:
          GWT_FLAKE_TARGETS: ${{ needs.changes.outputs.flake_targets }}
        run: scripts/ci-flake-detect.sh
        timeout-minutes: 45

  test-python-runner:
    name: Test (Python runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r crates/gwt-core/runtime/project_index_requirements.txt
          pip install pytest
      - name: Run Phase 8 runner tests
        env:
          GWT_INDEX_FAKE_EMBEDDING: "1"
        run: pytest -q crates/gwt-core/runtime/tests crates/gwt-core/runtime/test_chroma_index_runner.py
        timeout-minutes: 10

  test-index-e2e:
    name: Test (e5 e2e, optional)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
        continue-on-error: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Cache HuggingFace model (e5-base)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-cache-multilingual-e5-base-v1
      - name: Bootstrap gwt runtime assets
        run: |
          mkdir -p ~/.gwt/runtime
          cp crates/gwt-core/runtime/chroma_index_runner.py ~/.gwt/runtime/
          python -m venv ~/.gwt/runtime/chroma-venv
          ~/.gwt/runtime/chroma-venv/bin/pip install --upgrade pip
          ~/.gwt/runtime/chroma-venv/bin/pip install -r crates/gwt-core/runtime/project_index_requirements.txt
      - name: Run ignored e2e tests with real e5 model
        run: cargo test -p gwt-core --tests -- --ignored
        timeout-minutes: 30
        continue-on-error: true

  test-windows-rust:
    name: Test (Rust, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-workspace
        continue-on-error: true
      - name: Run managed hook self-heal regressions
        shell: bash
        run: |
          cargo test -p gwt --bin gwt app_runtime::tests::startup_self_heal_converges_legacy_config_without_a_runtime_guard -- --exact --test-threads=1
          cargo test -p gwt --test hook_health_test codex_hook_audit_and_repair_cover_worktree_local_and_workspace_home_copies -- --exact --test-threads=1
        timeout-minutes: 15
      - name: Run shared Windows process resolver tests
        run: cargo test -p gwt-core --test windows_process_resolver --test process_adapter_parity
        timeout-minutes: 15
      - name: Run real Claude probe caller regressions
        shell: bash
        run: |
          cargo test -p gwt-core --lib real_bun_global_placeholder_fixture
          cargo test -p gwt-agent --lib real_bun_global_placeholder_fixture
          cargo test -p gwt-agent --lib package_runner_resolution_failure_still_emits_an_end_summary
          cargo test -p gwt --bin gwt real_bun_global_placeholder_fixture
          cargo test -p gwt --bin gwt command_prompt_agent_wrapper
        timeout-minutes: 15
      - name: Run Windows PTY resolver adapter tests
        run: cargo test -p gwt-terminal --lib pty::windows_spawn::tests -- --test-threads=1
        timeout-minutes: 15
      # Issue #3631: a GUI-subsystem PTY start gate is never attached to the
      # pane's pseudoconsole, so the released agent renders in an external
      # Windows Terminal window. Both guards are Windows-only and would be
      # skipped by the Linux workspace run.
      - name: Run Windows PTY start-gate console contracts
        shell: bash
        run: |
          cargo test -p gwt --test windows_binary_subsystem_test -- --test-threads=1
          cargo test -p gwt --test pty_start_gate_console_test -- --test-threads=1
        timeout-minutes: 15
      - name: Run Issue Monitor scheduled driver contracts
        shell: bash
        run: |
          cargo test -p gwt --bin gwt scheduled_tick_is_single_flight_per_canonical_project_scope -- --test-threads=1
          cargo test -p gwt --bin gwt scheduled_tick_drives_disabled_claim_cleanup_without_scanning -- --test-threads=1
          cargo test -p gwt --bin gwt scheduled_tick_advances_autonomous_launch_without_an_external_daemon -- --test-threads=1
          cargo test -p gwt --bin gwt app_runtime_local_driver_ -- --test-threads=1
          cargo test -p gwt --lib local_fallback_lease -- --test-threads=1
        timeout-minutes: 15
      - name: Run Issue Monitor launch_now control-path contracts
        shell: bash
        run: |
          cargo test -p gwt --lib cli::issue::tests::windows_launch_now_ -- --test-threads=1
          cargo test -p gwt --lib cli::issue::tests::immediate_scan_delivery_never_claims_an_unacknowledged_schedule -- --exact --test-threads=1
          cargo test -p gwt --lib cli::pane::tests::pane_websocket_request_carries_the_agent_capability_in_authorization -- --exact --test-threads=1
          cargo test -p gwt --lib cli::pane::tests::issue_monitor_scan_client_ -- --test-threads=1
          cargo test -p gwt --bin gwt embedded_server::tests::authenticated_monitor_scan_routes_scope_guard_and_result_only_to_origin_socket -- --exact --test-threads=1
          cargo test -p gwt --bin gwt authenticated_pm_scan_now_ -- --test-threads=1
          cargo test -p gwt --bin gwt authenticated_scan_now_ -- --test-threads=1
          cargo test -p gwt --test issue_monitor_protocol_test frontend_issue_monitor_events_use_snake_case_wire_shape -- --exact --test-threads=1
          cargo test -p gwt --test issue_monitor_protocol_test agent_issue_monitor_scan_ -- --test-threads=1
        timeout-minutes: 15
      - name: Run agent process resolver caller contracts
        run: cargo test -p gwt --test agent_process_resolution_contract_test
        timeout-minutes: 15
      - name: Run Windows runtime daemon named-pipe transport contracts
        shell: bash
        run: |
          cargo test -p gwt --lib cli::daemon::transport -- --test-threads=1
          cargo test -p gwt --lib cli::daemon::client -- --test-threads=1
          cargo test -p gwt --lib cli::daemon::tests -- --test-threads=1
          cargo test -p gwt --lib daemon_subscriber -- --test-threads=1
          cargo test -p gwt --lib daemon_supervisor -- --test-threads=1
          cargo test -p gwt --lib process::tests -- --test-threads=1
          cargo test -p gwt-core --lib daemon_pipe_name -- --test-threads=1
        timeout-minutes: 20
      # Issue #4078 AC-4: the wait declaration is the only way a Windows agent
      # can tell the Issue Monitor its silence is a wait rather than a stall.
      # Both the acceptance of a declaration and its durable prefs fallback are
      # host-state contracts, so they are pinned on the Windows job rather than
      # inferred from the Linux run.
      - name: Run Issue Monitor wait declaration contracts
        shell: bash
        run: |
          cargo test -p gwt --lib cli::issue::tests::monitor_wait_ -- --test-threads=1
          cargo test -p gwt --lib issue_monitor::tests::wait_declaration_ -- --test-threads=1
          cargo test -p gwt --lib issue_monitor::tests::agent_status_projects_the_wait_declaration -- --exact --test-threads=1
        timeout-minutes: 15
      - name: Run release asset contract tests
        run: node scripts/test_release_assets.cjs
        timeout-minutes: 15
      # Issue #3777: measure the warm 250ms acceptance contract without other
      # tests competing for CPU and file I/O. The full default-parallel proof
      # remains in nightly.yml alongside the other deadline-sensitive tests.
      - name: Measure warm prompt latency in isolation
        run: cargo test -p gwt --lib --all-features cli::hook::event_dispatcher::tests::warm_four_megabyte_history_user_prompt_submit_p95_stays_within_budget -- --exact --test-threads=1
        timeout-minutes: 15

  # The default-parallel determinism proof lives in nightly.yml (Issue #4134
  # AC-1). It re-ran on Windows a suite Linux had already run, cost 2806s, and
  # was this workflow's entire critical path; what it proves is a property of
  # develop rather than of one pull request.
  test-windows-agent-launch-e2e:
    name: Test (Windows agent launch)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-workspace
        continue-on-error: true
      # Issue #4134 AC-2: the four provider/selector combinations used to be a
      # four-way matrix, and every shard paid the same 279s cold build to run
      # 137s of tests — 1116s of build for 548s of test. The build happens once
      # here, on its own budget, and the combinations follow in one job.
      - name: Build the deterministic Windows agent launch E2E
        run: cargo test -p gwt --test windows_agent_launch_e2e --no-run
        timeout-minutes: 30
      # Issue #4644 AC-5: the non-ignored contract tests in this cfg(windows)
      # target (e.g. the Hub bootstrap reply classifier) are compiled nowhere
      # else, so run them once before the provider combinations.
      - name: Run Windows agent launch E2E contract tests
        run: cargo test -p gwt --test windows_agent_launch_e2e
      # The matrix used fail-fast: false so one broken provider could not hide
      # the others. The loop keeps that: every combination runs, each one is a
      # collapsible log group, a failing one emits an ::error:: annotation, and
      # the step fails at the end.
      - name: Run credential-free deterministic Windows agent launch E2E
        shell: bash
        env:
          GWT_WINDOWS_AGENT_E2E_CREDENTIAL_FREE: "1"
        run: |
          status=0
          for combination in codex/latest codex/exact claude/latest claude/exact; do
            provider=${combination%/*}
            selector=${combination#*/}
            echo "::group::windows agent launch E2E ${combination}"
            if GWT_WINDOWS_AGENT_PROVIDER="$provider" GWT_WINDOWS_AGENT_SELECTOR="$selector" \
              cargo test -p gwt --test windows_agent_launch_e2e -- --ignored --test-threads=1 --nocapture; then
              echo "ok ${combination}"
            else
              echo "::error::windows agent launch E2E failed for ${combination}"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
        timeout-minutes: 60

  test-frontend:
    name: Test (Frontend + WebView E2E)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Run verification reporter regressions
        run: node --test crates/gwt/src/cli/verification_record/headed_e2e_reporter.test.cjs scripts/coverage-summary.test.mjs
      - name: Run frontend unit tests
        run: bash scripts/run-frontend-unit-tests.sh
        timeout-minutes: 10
      - name: Run frontend smoke tests
        run: bash scripts/run-frontend-smoke-tests.sh
        timeout-minutes: 10
      # Browser bootstrap is split three ways on purpose (#3659). A single
      # `playwright install --with-deps` hid an unbounded apt transaction
      # behind a browser download, so a stalled mirror surfaced only as an
      # opaque 10-minute step timeout. scripts/playwright-version.txt is the
      # one pin shared with run-visual-tests.sh, so the cache key cannot drift
      # from the revision the specs resolve, and the shared
      # ~/.cache/ms-playwright is reused by the script's temp-dir install.
      - name: Resolve pinned Playwright version
        id: playwright
        run: echo "version=$(cat scripts/playwright-version.txt)" >>"$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright system dependencies (apt)
        run: bash scripts/install-playwright-browsers.sh system-deps
        timeout-minutes: 10
      - name: Install Playwright chromium browser
        run: bash scripts/install-playwright-browsers.sh browsers
        timeout-minutes: 10
      # Embedded-frontend specs stub WebSocket + serve crates/gwt/web via
      # page.route, so they run without a live gwt. live-gwt specs self-skip
      # when GWT_PLAYWRIGHT_BASE_URL is unset.
      - name: Run WebView E2E (embedded Playwright specs)
        run: bash scripts/run-visual-tests.sh
