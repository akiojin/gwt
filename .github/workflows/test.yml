      # the same direct probe, Session persistence, and ConPTY launch routes.
      - name: Build the deterministic Windows agent launch E2E
        # Test inherits dev; keep assertions/features while omitting CI line tables.
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p gwt --test windows_agent_launch_e2e --no-run
        timeout-minutes: 30
      # Issue #4644 AC-5: the non-ignored contract tests in this cfg(windows)
      # target (e.g. the Hub bootstrap reply classifier) are compiled nowhere
      # else, so run them once before the provider combinations.
      - name: Run Windows agent launch E2E contract tests
        # Test inherits dev; keep assertions/features while omitting CI line tables.
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo test -p gwt --test windows_agent_launch_e2e
      # Run both providers even when one fails, retaining native diagnostics.
      - name: Run credential-free deterministic Windows agent launch E2E
        shell: bash
        env:
          GWT_WINDOWS_AGENT_E2E_CREDENTIAL_FREE: "1"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          status=0
          providers=(codex claude)
          pids=()
          # Fixtures isolate HOME, npm state, registry/server ports, and sessions.
          for provider in codex claude; do
            GWT_WINDOWS_AGENT_PROVIDER="$provider" \
              cargo test -p gwt --test windows_agent_launch_e2e -- --ignored --test-threads=1 --nocapture > "$RUNNER_TEMP/windows-agent-${provider}.log" 2>&1 &
            pids+=("$!")
          done
          # Keep both outcomes and the existing provider-specific diagnostics.
          for index in "${!pids[@]}"; do
            provider="${providers[$index]}"
            echo "::group::windows installed agent launch E2E ${provider}"
            if wait "${pids[$index]}"; then
              echo "ok ${provider}/installed"
            else
              echo "::error::windows agent launch E2E failed for ${provider}/installed"
              status=1
            fi
            cat "$RUNNER_TEMP/windows-agent-${provider}.log"
            echo "::endgroup::"
          done
          exit "$status"
        timeout-minutes: 60

  test-frontend:
    name: Test (Frontend + WebView E2E)
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-test-frontend
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    needs: [changes, source-sync]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - name: Run verification reporter regressions
        run: node --test crates/gwt/src/cli/verification_record/headed_e2e_reporter.test.cjs scripts/coverage-summary.test.mjs
      - name: Run frontend unit tests
        env:
          GWT_PULL_RENDER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ -n "$GWT_PULL_RENDER_BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$GWT_PULL_RENDER_BASE_SHA"
          fi
          bash scripts/run-frontend-unit-tests.sh --test-concurrency=1
        timeout-minutes: 10
      - name: Run frontend smoke tests
        run: bash scripts/run-frontend-smoke-tests.sh
        timeout-minutes: 10
      # Browser bootstrap is split three ways on purpose (#3659). A single
      # `playwright install --with-deps` hid an unbounded apt transaction
      # behind a browser download, so a stalled mirror surfaced only as an
      # opaque 10-minute step timeout. scripts/playwright-version.txt is the
      # one pin shared with run-visual-tests.sh, so the cache key cannot drift
      # from the revision the specs resolve, and the shared
      # ~/.cache/ms-playwright is reused by the script's temp-dir install.
      - name: Resolve pinned Playwright version
        id: playwright
        run: echo "version=$(cat scripts/playwright-version.txt)" >>"$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright system dependencies (apt)
        run: bash scripts/install-playwright-browsers.sh system-deps
        timeout-minutes: 10
      - name: Install Playwright chromium browser
        run: bash scripts/install-playwright-browsers.sh browsers
        timeout-minutes: 10
      # Embedded-frontend specs stub WebSocket + serve crates/gwt/web via
      # page.route, so they run without a live gwt. live-gwt specs self-skip
      # when GWT_PLAYWRIGHT_BASE_URL is unset.
      - name: Run WebView E2E (embedded Playwright specs)
        run: bash scripts/run-visual-tests.sh
        timeout-minutes: 15

  report-post-merge-failure:
    needs: [source-sync, changes, test, test-linux-infrastructure, test-rust-required, flake-detection, test-python-runner, test-index-e2e, test-windows-core-build, test-windows-core-stability, test-windows-index-stability, test-windows-rust, test-windows-rust-lib, test-windows-warm, test-windows-required, test-windows-agent-launch-e2e, test-frontend]
    if: ${{ github.event_name == 'push' && failure() }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}-report-post-merge-failure
      cancel-in-progress: ${{ needs.source-sync.outputs.base_only == 'false' }}
    permissions:
      issues: write
    uses: ./.github/workflows/post-merge-ci.yml
