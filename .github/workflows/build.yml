name: Build

on:
  pull_request:
    branches: [develop, main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #4191 AC-2: keyed on scripts/ci-apt.sh, which owns the package
      # list, so a changed set is never served the previous archive.
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
        timeout-minutes: 5
      # Issue #4191: scripts/ci-apt.sh owns the deadline (900s) and retries
      # inside it; this cap is only the outer net and must stay above it, so
      # the script and not GitHub reports a dependency-install failure. The
      # measured step distribution behind the numbers is recorded in test.yml.
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
        continue-on-error: true
      - name: Build workspace targets
        run: cargo build -p gwt-core -p gwt --all-features

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-workspace
        continue-on-error: true
      - name: Check Windows compilation
        run: cargo check -p gwt-core -p gwt

  check-macos:
    name: Check (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Reset broken pre-installed Rust on macOS runners
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/.cargo" "$HOME/.rustup" || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-workspace
        continue-on-error: true
      - name: Check macOS compilation
        run: cargo check -p gwt-core -p gwt
