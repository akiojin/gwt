name: Build

on:
  pull_request:
    branches: [develop, main]

jobs:
  # Issue #4134 AC-3: this job is redundant on Linux. `cargo test --workspace
  # --all-features` in test.yml compiles the same crates with the same features
  # and links the `gwt` binaries too, because the integration tests reach them
  # through CARGO_BIN_EXE_*. (The Issue proposed clippy as the job that
  # subsumes it; that is not right — `cargo clippy --all-targets` type-checks
  # but never links, so it cannot stand in for a build.) Removing the job is
  # therefore safe for coverage but not for merges: `Build` is a required
  # status check on develop, so deleting it leaves every pull request waiting
  # for a context that no longer reports. Dropping the context is a branch
  # protection change and stays the repository owner's call; until then the
  # ~131s duplicate is deliberate. The duplication costs runner minutes and
  # queue slots (#4119), not wall clock — build.yml runs beside test.yml.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #4191 AC-2: keyed on scripts/ci-apt.sh, which owns the package
      # list, so a changed set is never served the previous archive.
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          # Issue #4268: without a prefix fallback the key only ever hits on an
          # unchanged scripts/ci-apt.sh, so editing the script guarantees one
          # cold run that fetches all 59.2 MB from a mirror -- which is the run
          # a stalled mirror kills. The fallback restores the previous archives
          # and lets apt fetch only the delta. Correctness does not depend on
          # it: apt uses an archive only when the filename and version match
          # what it resolved, and the exact key above still decides what is
          # saved.
          restore-keys: |
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      # Issue #4191: scripts/ci-apt.sh owns the deadline (900s) and retries
      # inside it; this cap is only the outer net and must stay above it, so
      # the script and not GitHub reports a dependency-install failure. The
      # measured step distribution behind the numbers is recorded in test.yml.
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - name: Build workspace targets
        run: cargo build -p gwt-core -p gwt --all-features

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-windows
        continue-on-error: true
      - name: Check Windows compilation
        run: cargo check -p gwt-core -p gwt

  check-macos:
    name: Check (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Reset broken pre-installed Rust on macOS runners
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/.cargo" "$HOME/.rustup" || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-macos
        continue-on-error: true
      - name: Check macOS compilation
        run: cargo check -p gwt-core -p gwt
