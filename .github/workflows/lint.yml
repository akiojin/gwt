name: Lint

on:
  pull_request:
    branches: [develop, main]

# Issue #4119: one run per PR. A develop merge turns every open PR BEHIND, the
# update-branch `synchronize` starts a fresh run, and without this group the
# superseded run stayed queued beside it (3-5 runs per branch, 35 queued and 0
# running on 2026-09-07). Keyed by workflow + PR number so a new push cancels
# only this PR's older run of this workflow. Pinned by
# crates/gwt/tests/ci_concurrency_contract_test.rs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cargo Deny (advisories + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.4
      - name: Run cargo deny (advisories + sources)
        run: cargo deny check advisories sources
  lint:
    name: Clippy & Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #4191 AC-2: keyed on scripts/ci-apt.sh, which owns the package
      # list, so a changed set is never served the previous archive.
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          # Issue #4268: without a prefix fallback the key only ever hits on an
          # unchanged scripts/ci-apt.sh, so editing the script guarantees one
          # cold run that fetches all 59.2 MB from a mirror -- which is the run
          # a stalled mirror kills. The fallback restores the previous archives
          # and lets apt fetch only the delta. Correctness does not depend on
          # it: apt uses an archive only when the filename and version match
          # what it resolved, and the exact key above still decides what is
          # saved.
          restore-keys: |
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      # Issue #4191: scripts/ci-apt.sh owns the deadline (900s) and retries
      # inside it; this cap is only the outer net and must stay above it, so
      # the script and not GitHub reports a dependency-install failure. The
      # measured step distribution behind the numbers is recorded in test.yml.
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace
        continue-on-error: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check rustdoc warnings
        # The codebase is at 0 rustdoc warnings post-PR #2331; this
        # gate keeps it that way by failing CI if a future PR
        # reintroduces a broken intra-doc link, an unclosed HTML tag,
        # or a public-doc link to a private item.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --document-private-items
      - name: Check frontend bundle syntax
        run: bash scripts/check-frontend-bundle.sh
      - name: Check release flow contract
        run: bash scripts/check-release-flow.sh
      # SPEC #3576: the Git hook contract, including the rule that `git push`
      # starts no heavy Cargo job outside the host-wide verification lease.
      # The script existed before but no workflow ran it, so the guard could
      # not actually stop the regression it describes.
      - name: Check Git hook contract
        run: bash scripts/verify-husky-hooks.sh
      - name: Run Markdownlint
        uses: nosborn/github-action-markdown-cli@v3.5.0
        with:
          files: .
          config_file: .markdownlint.json
          ignore_files: |
            target/
            CHANGELOG.md
      - name: Validate SKILL.md frontmatter
        run: bash scripts/validate-skill-frontmatter.sh

  lint-windows:
    name: Clippy (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-workspace
        continue-on-error: true
      - name: Run Windows Clippy
        run: cargo clippy -p gwt -p gwt-core --all-targets --all-features -- -D warnings
        timeout-minutes: 30

  # Issue #4522. `#[cfg(target_os = "macos")]` code is not compiled by the
  # ubuntu or windows clippy jobs, so a lint violation behind it was invisible
  # to CI. On 2026-09-20 the `fsevent-sys` 4.1.0 -> 5.2.0 bump (dependabot PR
  # #4515) deprecated the crate's whole C API; CI merged it green while
  # `gwt-core` stopped compiling under `-D warnings` on every macOS host at
  # once, and no agent could deliver a PR until the suppression landed.
  #
  # Scope is deliberately the ubuntu job's gate verbatim rather than the
  # narrowed Windows one. This command is what `verify.plan` derives and every
  # macOS agent must pass locally before it can deliver
  # (crates/gwt/src/cli/verify_derivation.rs `CI_CLIPPY_GATE`), and pinning the
  # two to the same string is the whole point: narrowing to `-p gwt -p
  # gwt-core` would leave the macOS-gated code in gwt-agent, gwt-config and
  # gwt-clipboard unlinted here while still failing the local gate, which is
  # the same divergence in a smaller shape. The repository is public, so the
  # macOS runner costs queue time rather than billed minutes; `macos-workspace`
  # is warmed for it by cache-warm.yml.
  lint-macos:
    name: Clippy (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      # Mirrors build.yml's check-macos: the pre-installed Rust on macOS
      # runners is broken, and the reset has to happen before the toolchain
      # action so every macOS job hashes the same `rustc -vV` into the cache
      # key.
      - name: Reset broken pre-installed Rust on macOS runners
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/.cargo" "$HOME/.rustup" || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-workspace
        continue-on-error: true
      # 45 and not the Windows job's 30: `Check (macOS)` runs 1-2 min warm, and
      # the ubuntu clippy gate runs ~4.5 min warm, but `macos-workspace` is
      # warmed from this commit onward and the first runs restore a scope built
      # for `cargo check -p gwt-core -p gwt` alone. The cap is the outer net for
      # that cold start, not the expected duration.
      - name: Run macOS Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        timeout-minutes: 45

  commitlint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Validate commit messages
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MERGE_BASE=$(git merge-base "$HEAD_SHA" "$BASE_SHA" || true)
          LAST_BASE_MERGE=$(
            git rev-list --merges --first-parent "$HEAD_SHA" | while read -r merge; do
              p2=$(git rev-parse "$merge^2" 2>/dev/null) || continue
              if git merge-base --is-ancestor "$p2" "$BASE_SHA"; then
                echo "$merge"
                break
              fi
            done
          )
          FROM_SHA=${LAST_BASE_MERGE:-${MERGE_BASE:-$BASE_SHA}}
          COMMIT_COUNT=$(git rev-list --count "$FROM_SHA".."$HEAD_SHA")
          if [ "$COMMIT_COUNT" -gt 100 ]; then
            bunx --package @commitlint/cli@20.4.1 commitlint --config commitlint.config.cjs --from "HEAD~50" --to "HEAD" --verbose
          else
            bunx --package @commitlint/cli@20.4.1 commitlint --config commitlint.config.cjs --from "$FROM_SHA" --to "$HEAD_SHA" --verbose
          fi
