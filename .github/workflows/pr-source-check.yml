name: PR Source Branch Check

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

# Issue #4119: one run per PR. A develop merge turns every open PR BEHIND, the
# update-branch `synchronize` starts a fresh run, and without this group the
# superseded run stayed queued beside it (3-5 runs per branch, 35 queued and 0
# running on 2026-09-07). Keyed by workflow + PR number so a new push cancels
# only this PR's older run of this workflow. Pinned by
# crates/gwt/tests/ci_concurrency_contract_test.rs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "PR head ref: $PR_HEAD_REF"

          # Allow PRs only from develop branch
          if [[ "$PR_HEAD_REF" == develop ]]; then
            echo "Valid source branch: $PR_HEAD_REF"
            exit 0
          fi

          echo "::error::PRs to main must come from the 'develop' branch only."
          echo "::error::Current source branch: $PR_HEAD_REF"
          echo ""
          echo "Please:"
          echo "1. Close this PR"
          echo "2. Merge your changes into develop first"
          echo "3. Use the /release command to create a proper release PR from develop"
          exit 1
