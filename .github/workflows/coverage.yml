name: Coverage Report

on:
  workflow_call:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Issue #4119: a manual dispatch supersedes a still-running scheduled report.
concurrency:
  # Called workflows inherit github.workflow from the caller. A distinct
  # prefix prevents coverage from cancelling its own caller workflow.
  group: coverage-${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'report' || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

env:
  # Only coverage artifacts omit backtrace line tables; instrumentation,
  # debug assertions and the unoptimized test behavior stay unchanged.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  coverage-shard:
    name: Coverage shard (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'schedule' && 'develop') || github.sha }}
      # Issue #4191 AC-2: keyed on scripts/ci-apt.sh, which owns the package
      # list, so a changed set is never served the previous archive.
      - name: Cache Linux GTK dependency packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/gwt-apt-archives
          key: gwt-apt-gtk-${{ runner.os }}-${{ hashFiles('scripts/ci-apt.sh') }}
          # Issue #4268: without a prefix fallback the key only ever hits on an
          # unchanged scripts/ci-apt.sh, so editing the script guarantees one
          # cold run that fetches all 59.2 MB from a mirror -- which is the run
          # a stalled mirror kills. The fallback restores the previous archives
          # and lets apt fetch only the delta. Correctness does not depend on
          # it: apt uses an archive only when the filename and version match
          # what it resolved, and the exact key above still decides what is
          # saved.
          restore-keys: |
            gwt-apt-gtk-${{ runner.os }}-
        timeout-minutes: 5
      # Issue #4191: scripts/ci-apt.sh owns the deadline (900s) and retries
      # inside it; this cap is only the outer net and must stay above it, so
      # the script and not GitHub reports a dependency-install failure. The
      # measured step distribution behind the numbers is recorded in test.yml.
      - name: Install tray + GTK dependencies (Linux)
        run: sudo GWT_APT_CACHE_DIR="$HOME/.cache/gwt-apt-archives" bash scripts/ci-apt.sh gtk-deps
        timeout-minutes: 18
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # llvm-cov builds into its own instrumented target, not target/debug.
          # Develop writes the base-branch cache every PR can restore; reports
          # retain their existing save path. A miss still builds from source.
          # Separate this from earlier default-target/dependency-only caches.
          key: coverage-instrumented-workspace-v2
          workspaces: . -> target/llvm-cov-target
          cache-workspace-crates: true
          save-if: ${{ matrix.shard == 1 && (github.ref == 'refs/heads/develop' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      # Coverage is measured workspace-wide so every crate is visible in
      # Codecov, but the 90% release threshold applies to gwt-core + gwt
      # only (historical mandate surface; outer shells are excluded inside
      # check-coverage-threshold.mjs). The remaining domain crates are
      # gated by an 80% floor as a ratchet (measured ~83% on 2026-06-10);
      # raise the floor toward 90% as their test suites grow.
      # coverage-summary.mjs runs the tests, then reads every raw profile
      # before aggregating, so a truncated profile is reported apart from a
      # test failure and re-aggregated once, on record (Issue #4628).
      - name: Run and export coverage shard
        env:
          # Nextest starts one process per test. Share eight online-merge
          # profiles per instrumented module instead of one copy per PID.
          LLVM_PROFILE_FILE_NAME: gwt-%8m.profraw
          NEXTEST_PROFILE: coverage
        run: node scripts/coverage-summary.mjs --nextest --partition slice:${{ matrix.shard }}/6 --export-dir target/coverage-export -- --workspace --all-features
        timeout-minutes: 20
      - name: Upload coverage shard
        uses: actions/upload-artifact@v7
        with:
          name: workspace-tests-${{ matrix.shard }}
          path: target/coverage-export/
          if-no-files-found: error
          retention-days: 1

  rust-coverage:
    name: Rust Coverage
    needs: coverage-shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify coverage shards succeeded
        env:
          COVERAGE_SHARDS_RESULT: ${{ needs.coverage-shard.result }}
        run: test "$COVERAGE_SHARDS_RESULT" = success
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || (github.event_name == 'schedule' && 'develop') || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Download coverage shards
        uses: actions/download-artifact@v8
        with:
          pattern: workspace-tests-*
          path: target/coverage-shards
      - name: Verify the complete workspace test union
        run: python3 scripts/ci_workspace_tests.py target/coverage-shards --shards 6
      - name: Generate workspace summary
        run: node scripts/coverage-summary.mjs --report-from target/coverage-shards --shards 6 --output-path target/coverage-summary.json
        timeout-minutes: 5
      - name: Enforce coverage threshold (gwt-core + gwt @ 90%)
        run: node scripts/check-coverage-threshold.mjs target/coverage-summary.json 90 --scope "crates/(gwt-core|gwt)/"
      - name: Enforce coverage floor (domain crates @ 80%)
        run: node scripts/check-coverage-threshold.mjs target/coverage-summary.json 80 --scope-exclude "crates/(gwt-core|gwt)/"
      # Reuse the same validated combined profiles and current objects.
      - name: Generate lcov
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/coverage-summary.mjs --report-from target/coverage-shards --shards 6 --output-path target/coverage-summary.json --lcov-output-path lcov.info
        timeout-minutes: 15
      - name: Upload to Codecov
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
