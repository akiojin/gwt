# TEMPORARY verification workflow for Issue #4014.
#
# The fix this branch carries can only be proven on Windows: the ConPTY output
# pipe signals EOF on pseudoconsole close, which no macOS or Linux runner can
# reproduce. The nightly job that owns the default-parallel proof runs only on
# `develop`, so it cannot gate this branch. These two jobs stand in for it.
#
#   prove    — the exact loop nightly.yml runs, three passes over
#              `-p gwt --bin gwt` at default parallelism on one SHA. This is
#              #4014 AC-1 and AC-5.
#   serial   — insurance. `--test-threads=1` makes libtest print each test
#              name *before* running it, so if anything still hangs the
#              culprit is the last line of the log instead of an unnamed
#              90-minute timeout. It also separates a single-test hang from
#              one that needs concurrency.
#
# Delete this file once the evidence is recorded on the Issue and the PR.
name: Issue 4014 verification

on:
  workflow_dispatch:
  push:
    branches: [work/issue-4014]

concurrency:
  group: issue-4014-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    name: Default-parallel --bin gwt, three passes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      # Build outside the loop for the same reason nightly.yml does: a slow
      # compile charged to the first iteration reads as an unstable suite.
      - name: Build the target
        run: cargo test -p gwt --bin gwt --all-features --no-run
        timeout-minutes: 45
      - name: Prove the target is stable at default parallelism
        shell: pwsh
        run: |
          Remove-Item Env:RUST_TEST_THREADS -ErrorAction SilentlyContinue
          Write-Host "logical processors: $([Environment]::ProcessorCount)"
          1..3 | ForEach-Object {
            Write-Host "default-parallel run $_ of 3"
            cargo test -p gwt --bin gwt --all-features
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
        timeout-minutes: 150

  serial:
    name: Serial app_runtime (names any remaining hang)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
      - name: Build the target
        run: cargo test -p gwt --bin gwt --all-features --no-run
        timeout-minutes: 45
      # `--nocapture` keeps libtest's writes unbuffered so the name of a test
      # that never returns survives a step timeout.
      - name: Run app_runtime serially
        run: cargo test -p gwt --bin gwt --all-features app_runtime::tests:: -- --test-threads=1 --nocapture
        timeout-minutes: 60
