name: Auto Merge PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop

# Issue #4119: one run per PR. A develop merge turns every open PR BEHIND, the
# update-branch `synchronize` starts a fresh run, and without this group the
# superseded run stayed queued beside it (3-5 runs per branch, 35 queued and 0
# running on 2026-09-07). Keyed by workflow + PR number so a new push cancels
# only this PR's older run of this workflow. Pinned by
# crates/gwt/tests/ci_concurrency_contract_test.rs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.login == 'akiojin' ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PERSONAL_ACCESS_TOKEN not provided, skipping auto-merge"
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --auto --merge --repo "$REPO"
