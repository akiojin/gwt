[package]
name = "gwt-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "PTY management, vt100 terminal emulation, and scrollback for gwt"
publish = false

[dependencies]
# Issue #4142: the PTY spawn path reports the process descriptor budget when a
# launch fails with `Too many open files`, so `gwt_core::fd_limit` is needed on
# every target rather than only on Windows.
gwt-core.workspace = true
portable-pty.workspace = true
thiserror.workspace = true
tracing.workspace = true
vt100 = "0.16"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
