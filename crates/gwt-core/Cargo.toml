[package]
name = "gwt-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gwt-config = { path = "../gwt-config" }
thiserror = { workspace = true }
dirs = "7"
which = "8"
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
semver = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
ignore = { workspace = true }
dunce = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
uuid = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
libc = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
fsevent-sys = "5.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
serde_yaml = { workspace = true }

[dev-dependencies]
# Issue #4296: gwt-core's own integration tests live outside the lib, so
# `cfg(test)` does not reach them. Depending on self with `test-support` makes
# `gwt_core::test_support` (env lock, `ScopedEnvVar`, `ScopedGwtHome`)
# available to `crates/gwt-core/tests/` without `--all-features`.
gwt-core = { path = ".", features = ["test-support"] }
tempfile = { workspace = true }
fs2 = { workspace = true }
serde_json = { workspace = true }

[features]
# Exposes `gwt_core::test_support` (env lock + ScopedEnvVar) to dependent
# crates' tests. Enable from dev-dependencies only (SPEC-3016 FR-003).
test-support = []
