# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Schema is for cargo-deny 0.18+. Older `vulnerability = "deny"` /
# `unmaintained = "warn"` style is no longer accepted by the
# parser — vulnerability is implicit deny, and the lint level for
# unmaintained crates is now controlled by the top-level `[advisories]`
# ignore list instead.
#
# Scope: this config currently only covers the advisories check
# (`cargo deny check advisories`). License/ban policy is intentionally
# left unconfigured pending owner review — the historical license
# allowlist did not enumerate every license actually present in the
# transitive graph (e.g. `bzip2-1.0.6`, `CDLA-Permissive-2.0`,
# `Unicode-3.0`, `MPL-2.0`), and the bans table flagged every
# `dep.workspace = true` reference as a "wildcard" due to a known
# cargo-deny resolution issue with workspace deps.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Allowlisted advisories. Each entry MUST cite the advisory ID and
# carry a `reason` explaining why the issue is not exploitable in
# our use, plus the planned exit path.
ignore = [
    # quick-xml O(N^2) duplicate-attribute check (CPU-exhaustion DoS on
    # untrusted XML). We reach quick-xml only through wayland-scanner, a
    # BUILD-TIME code generator that parses trusted, repo-pinned Wayland
    # protocol XML on Linux — never attacker-controlled input, and never
    # part of the shipped runtime attack surface. wayland-scanner 0.31.x
    # pins quick-xml ^0.39, so the fixed 0.41 cannot be forced from here.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml quadratic duplicate-attr scan; only via wayland-scanner build-time codegen on trusted local protocol XML; blocked on wayland-rs adopting quick-xml >=0.41" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml NsReader unbounded namespace allocation; same wayland-scanner build-time-only exposure on trusted local protocol XML; blocked on wayland-rs adopting quick-xml >=0.41" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
